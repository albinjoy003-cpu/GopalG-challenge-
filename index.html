<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOPALJI CHALLENGE</title>

    <!-- HTML2Canvas Library to capture game snapshot as image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: 'Arial', sans-serif;
        }

        /* Game Stage takes up full mobile screen */
        #game-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            background: radial-gradient(circle, #2b1055, #000000);
            touch-action: manipulation;
        }

        /* Header / Title */
        .header-container {
            position: absolute;
            top: 15px;
            z-index: 20;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        h1.title {
            font-family: 'Verdana', 'Cinzel', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #FFE600;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #FF0055, 5px 5px 0px #000;
        }

        .instruction {
            color: #00FFFF;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px 3px #000;
            margin-top: 5px;
        }

        /* Gopalji Photo fills max screen size */
        #gopalji-head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 122vh;
            object-fit: contain;
            object-position: center;
            z-index: 1;
            pointer-events: none;
        }

        /* Wig image moving horizontally */
        #wig {
            position: absolute;
            /* Adjust wig width/height to fit your wig PNG nicely */
            width: 200px; 
            height: 130px;
            object-fit: contain;
            z-index: 10;
            /* Default vertical placement near top of head */
            top: 53vh; 
            pointer-events: none;
        }

        /* Ideal Target spot (Center offset where wig should ideally be placed) */
        #target-spot {
            position: absolute;
            top: 22vh;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 120px;
            pointer-events: none;
            z-index: 2;
        }

        /* Modal Overlay for Result */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .result-card {
            background: #1a1a1a;
            border: 3px solid #FFE600;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.4);
            color: #fff;
        }

        .marks-badge {
            display: inline-block;
            background: #FF0055;
            color: #FFF;
            font-size: 2rem;
            font-weight: 900;
            padding: 5px 20px;
            border-radius: 50px;
            margin: 10px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #result-preview {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid #333;
            margin-bottom: 10px;
            background: #000;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn {
            background: #FFE600;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #FFF;
        }
    </style>
</head>
<body>

    <div id="game-stage">
        <div class="header-container">
            <h1 class="title">GOPALJI CHALLENGE</h1>
            <p class="instruction">Tap screen to set the wig!</p>
        </div>

        <!-- Maximum size Gopalji background photo -->
        <img id="gopalji-head" src="gopalji.png" alt="Gopalji" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=gopalji';">

        <!-- Wig image moving left to right -->
        <img id="wig" src="wig.png" alt="Wig" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3201/3201558.png';">

        <!-- Target reference box -->
        <div id="target-spot"></div>
    </div>

    <!-- Result Popup Modal -->
    <div id="result-modal">
        <div class="result-card">
            <h2 style="color: #FFE600; margin-bottom: 5px;">RESULT</h2>
            <div id="marks-display" class="marks-badge">0 / 100</div>
            <p id="feedback-text" style="font-weight: bold; margin-bottom: 10px;">Checking accuracy...</p>
            
            <!-- Snapshot image showing final attempt -->
            <img id="result-preview" src="" alt="Result Image">

            <div class="btn-container">
                <button class="btn" onclick="resetGame()">Play Again</button>
                <a id="whatsapp-btn" class="btn btn-whatsapp" href="#" target="_blank">Share 📲</a>
            </div>
        </div>
    </div>

    <script>
        const stage = document.getElementById('game-stage');
        const wig = document.getElementById('wig');
        const modal = document.getElementById('result-modal');
        const marksDisplay = document.getElementById('marks-display');
        const feedbackText = document.getElementById('feedback-text');
        const resultPreview = document.getElementById('result-preview');
        const whatsappBtn = document.getElementById('whatsapp-btn');

        let currentX = 0;
        
        // MEDIUM SPEED HORIZONTAL MOVEMENT
        let speed = 5; 
        let direction = 1; // 1 = Right, -1 = Left
        let gameActive = true;
        let animationFrameId;

        function getLimits() {
            const stageWidth = stage.clientWidth;
            const wigWidth = wig.clientWidth;
            return {
                minX: 0,
                maxX: stageWidth - wigWidth
            };
        }

        function animate() {
            if (!gameActive) return;

            const limits = getLimits();
            currentX += speed * direction;

            if (currentX >= limits.maxX) {
                currentX = limits.maxX;
                direction = -1; // Reverse left
            } else if (currentX <= limits.minX) {
                currentX = limits.minX;
                direction = 1; // Reverse right
            }

            wig.style.left = currentX + 'px';
            animationFrameId = requestAnimationFrame(animate);
        }

        function handleTap(e) {
            // Prevent trigger if clicking modal buttons
            if (e.target.closest('#result-modal')) return;
            if (!gameActive) return;

            gameActive = false;
            cancelAnimationFrame(animationFrameId);

            // Calculate Marks (Accuracy)
            const stageWidth = stage.clientWidth;
            const wigWidth = wig.clientWidth;
            const targetX = (stageWidth - wigWidth) / 2; // Perfect horizontal center

            const distanceOffset = Math.abs(currentX - targetX);
            const maxAllowedError = stageWidth / 2;

            // Calculate score out of 100
            let score = Math.max(0, Math.round(100 - (distanceOffset / maxAllowedError) * 100));

            showResultScreen(score);
        }

        function showResultScreen(score) {
            marksDisplay.innerText = `${score} / 100`;

            if (score >= 95) {
                feedbackText.innerText = "🔥 PERFECT! Gopalji looks handsome!";
            } else if (score >= 75) {
                feedbackText.innerText = "😎 Good job! Nice hairstyle!";
            } else if (score >= 45) {
                feedbackText.innerText = "😂 Hilarious! Wig is slightly off!";
            } else {
                feedbackText.innerText = "💀 EPIC FAIL! Gopalji is still bald!";
            }

            // Capture stage screenshot as Result Image
            html2canvas(stage, { useCORS: true, logging: false }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                resultPreview.src = imgData;

                // WhatsApp text
                const text = encodeURIComponent(`💥 *GOPALJI CHALLENGE* 💥\nI placed the wig on Gopalji and scored *${score}/100 Marks*! 😂\nCan you do better?`);
                whatsappBtn.href = `https://api.whatsapp.com/send?text=${text}`;

                modal.style.display = 'flex';
            });
        }

        function resetGame() {
            modal.style.display = 'none';
            gameActive = true;
            
            // Random start direction and position
            const limits = getLimits();
            currentX = Math.floor(Math.random() * limits.maxX);
            direction = Math.random() > 0.5 ? 1 : -1;

            animate();
        }

        // Tap triggers
        window.addEventListener('pointerdown', handleTap);

        // Start
        window.onload = () => {
            resetGame();
        };
    </script>
</body>
</html>
